<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;padding:24px;color:#1a1a1a}
h1{font-size:18px;font-weight:500;margin-bottom:16px;color:#1a1a1a}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:8px;padding:10px 12px;border:0.5px solid #e0ddd5}
.stat-n{font-size:22px;font-weight:500;color:#1a1a1a}
.stat-l{font-size:11px;color:#888;margin-top:2px}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-row span{font-size:12px;color:#888}
.fbtn{font-size:11px;padding:3px 10px;border-radius:99px;border:0.5px solid #ccc;background:#fff;color:#666;cursor:pointer}
.fbtn.active{background:#e6f1fb;color:#185fa5;border-color:#85b7eb}
.fbtn:hover{background:#f0f0ea}
.phase-block{margin-bottom:4px}
.phase-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;border:0.5px solid #e0ddd5;background:#f5f5f0;cursor:pointer;user-select:none}
.phase-hdr:hover{background:#eeede8}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ptitle{font-size:13px;font-weight:500;color:#1a1a1a;flex:1}
.pmeta{font-size:11px;color:#888;white-space:nowrap}
.parr{font-size:10px;color:#bbb;transition:transform .2s;margin-left:4px}
.parr.open{transform:rotate(90deg)}
.pbody{display:none;border:0.5px solid #e0ddd5;border-top:none;border-radius:0 0 8px 8px}
.pbody.open{display:block}
.pbar-wrap{height:3px;background:#e0ddd5;margin:0 12px 6px;border-radius:2px;overflow:hidden;margin-top:6px}
.pbar-fill{height:100%;border-radius:2px;transition:width .3s}
.track-lbl{font-size:10px;font-weight:500;padding:5px 12px 3px;color:#888;background:#fafaf7;border-bottom:0.5px solid #e0ddd5;text-transform:uppercase;letter-spacing:.04em}
.trow{display:flex;align-items:flex-start;gap:8px;padding:6px 12px;border-bottom:0.5px solid #e0ddd5}
.trow:last-child{border-bottom:none}
.trow.hidden{display:none}
.chk{width:14px;height:14px;border-radius:3px;border:0.5px solid #ccc;flex-shrink:0;margin-top:2px;cursor:pointer;background:#fff}
.chk.done{background:#d4edda;border-color:#a3d4b0;display:flex;align-items:center;justify-content:center}
.chk.done::after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid #2d7a45;border-bottom:1.5px solid #2d7a45;transform:rotate(-45deg) translate(1px,2px)}
.ttxt{font-size:12px;color:#1a1a1a;line-height:1.5;flex:1}
.ttxt.struck{color:#bbb;text-decoration:line-through}
.tdl{font-size:11px;color:#888;white-space:nowrap;margin-top:1px;flex-shrink:0}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:middle}
.t-overdue{background:#fce8e8;color:#a32d2d}
.t-urgent{background:#fef3cd;color:#856404}
.t-erc{background:#e6f1fb;color:#185fa5}
.t-strat{background:#eeedfe;color:#3c3489}
.t-done{background:#d4edda;color:#2d7a45}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:11px;color:#888;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
</style>

const TAGS = {
  overdue:{label:'已逾期',cls:'t-overdue'},
  urgent:{label:'紧急',cls:'t-urgent'},
  erc:{label:'ERC',cls:'t-erc'},
  strat:{label:'战略',cls:'t-strat'},
  done:{label:'完成',cls:'t-done'}
};

let activeFilter = 'all';
let taskDone = {};

function renderAll(){
  const list = document.getElementById('phaselist');
  list.innerHTML = '';
  P.forEach(phase => {
    const block = document.createElement('div');
    block.className = 'phase-block';
    let totalT=0,doneT=0;
    phase.tracks.forEach(tr=>tr.tasks.forEach(t=>{totalT++;if(taskDone[phase.id+'|'+tr.name+'|'+t.t])doneT++;}));
    const pct = totalT?Math.round(doneT/totalT*100):0;
    const hdr = document.createElement('div');
    hdr.className='phase-hdr';
    hdr.innerHTML=`<div class="pdot" style="background:${phase.color}"></div><span class="ptitle">${phase.label}</span><span class="pmeta" id="meta-${phase.id}">${doneT}/${totalT}</span><span class="parr" id="arr-${phase.id}">&#9654;</span>`;
    const body = document.createElement('div');
    body.className='pbody';
    body.id='body-'+phase.id;
    const barWrap=document.createElement('div');barWrap.className='pbar-wrap';
    const barFill=document.createElement('div');barFill.className='pbar-fill';barFill.id='bar-'+phase.id;barFill.style.width=pct+'%';barFill.style.background=phase.color;
    barWrap.appendChild(barFill);body.appendChild(barWrap);
    phase.tracks.forEach(track=>{
      const lbl=document.createElement('div');lbl.className='track-lbl';lbl.textContent=track.name;body.appendChild(lbl);
      track.tasks.forEach(task=>{
        const key=phase.id+'|'+track.name+'|'+task.t;
        const isDone=!!taskDone[key];
        const matchFilter = activeFilter==='all'||task.tags.includes(activeFilter)||(activeFilter==='done'&&isDone);
        const row=document.createElement('div');
        row.className='trow'+(matchFilter?'':' hidden');
        const chk=document.createElement('div');chk.className='chk'+(isDone?' done':'');
        chk.addEventListener('click',()=>{
          taskDone[key]=!taskDone[key];
          const wasOpen=document.getElementById('body-'+phase.id).classList.contains('open');
          renderAll();
          if(wasOpen){document.getElementById('body-'+phase.id).classList.add('open');document.getElementById('arr-'+phase.id).classList.add('open');}
        });
        let tagHtml='';
        if(isDone){tagHtml+=`<span class="tag t-done">完成</span>`;}
        else{task.tags.forEach(tg=>{if(TAGS[tg])tagHtml+=`<span class="tag ${TAGS[tg].cls}">${TAGS[tg].label}</span>`;});}
        const txt=document.createElement('span');txt.className='ttxt'+(isDone?' struck':'');txt.innerHTML=task.t+tagHtml;
        const dl=document.createElement('span');dl.className='tdl';dl.textContent=task.dl||'';
        row.appendChild(chk);row.appendChild(txt);row.appendChild(dl);
        body.appendChild(row);
      });
    });
    hdr.addEventListener('click',()=>{
      body.classList.toggle('open');
      document.getElementById('arr-'+phase.id).classList.toggle('open');
    });
    block.appendChild(hdr);block.appendChild(body);
    list.appendChild(block);
  });
  updateSummary();
}

function updateSummary(){
  let total=0,done=0,overdue=0,urgent=0;
  P.forEach(phase=>phase.tracks.forEach(tr=>tr.tasks.forEach(t=>{
    const key=phase.id+'|'+tr.name+'|'+t.t;
    total++;
    if(taskDone[key])done++;
    else{
      if(t.tags.includes('overdue'))overdue++;
      if(t.tags.includes('urgent')&&!t.tags.includes('overdue'))urgent++;
    }
  })));
  document.getElementById('sumgrid').innerHTML=`
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">总任务数</div></div>
    <div class="stat"><div class="stat-n" style="color:#2d7a45">${done}</div><div class="stat-l">已完成</div></div>
    <div class="stat"><div class="stat-n" style="color:#a32d2d">${overdue}</div><div class="stat-l">逾期待补救</div></div>
    <div class="stat"><div class="stat-n" style="color:#856404">${urgent}</div><div class="stat-l">紧急待处理</div></div>
  `;
}

document.querySelectorAll('.fbtn').forEach(btn=>{
